<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Baitler — your AI butler for files, ideas, and data." />
    <title>Baitler</title>
    <!-- Apply the theme before first paint to avoid a flash of the wrong theme.
         Mirrors src/stores/theme.ts (zustand/persist envelope + system fallback). -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('baitler-theme');
          var theme = raw && JSON.parse(raw).state && JSON.parse(raw).state.theme;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* ignore — useApplyTheme will set it after hydration */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

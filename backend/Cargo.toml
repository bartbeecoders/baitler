# Baitler backend — Cargo workspace.
# Phase 1 has a single member (the HTTP API). Future phases add sibling crates
# (e.g. auth, storage, llm, shared domain types) here and inherit shared
# dependency versions from [workspace.dependencies] below.
[workspace]
resolver = "2"
members = ["crates/api"]
default-members = ["crates/api"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/bartbeecoders/baitler"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "2", default-features = false, features = [
    "protocol-ws",
    "protocol-http",
    "kv-mem",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
dotenvy = "0.15"
include_dir = "0.7"

[profile.release]
strip = true
lto = "thin"

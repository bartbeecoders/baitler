# Baitler backend — Cargo workspace.
# Phase 1 has a single member (the HTTP API). Future phases add sibling crates
# (e.g. auth, storage, llm, shared domain types) here and inherit shared
# dependency versions from [workspace.dependencies] below.
[workspace]
resolver = "2"
members = ["crates/api"]
default-members = ["crates/api"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/bartbeecoders/baitler"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "2", default-features = false, features = [
    "protocol-ws",
    "protocol-http",
    "kv-mem",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
dotenvy = "0.15"
include_dir = "0.7"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
    "multipart",
] }
futures-util = "0.3"
async-stream = "0.3"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
lto = "thin"

[package]
name = "baitler-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Baitler HTTP API — Rust/Axum backend with SurrealDB."
# Two binaries (the API server + the `baitler-mcp` stdio bridge); make a bare
# `cargo run` start the server so existing scripts/docs keep working.
default-run = "baitler-api"

# Library exposes the app builder + modules so integration tests (and future
# crates) can construct and exercise the server in-process. The binary is a thin
# wrapper that loads config and serves.
[lib]
name = "baitler_api"
path = "src/lib.rs"

[[bin]]
name = "baitler-api"
path = "src/main.rs"

# stdio↔HTTP MCP bridge for clients that only speak stdio. Forwards newline-
# delimited JSON-RPC to a running Baitler server's `/mcp` endpoint.
[[bin]]
name = "baitler-mcp"
path = "src/bin/mcp_stdio.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
surrealdb.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
dotenvy.workspace = true
include_dir.workspace = true
uuid.workspace = true
async-trait.workspace = true
# Outbound HTTP for LLM providers (also used by integration tests). rustls avoids
# a system OpenSSL dependency.
reqwest.workspace = true
futures-util.workspace = true
async-stream.workspace = true
chacha20poly1305.workspace = true
sha2.workspace = true
hex.workspace = true
pulldown-cmark.workspace = true
html2md.workspace = true
ammonia.workspace = true

[features]
# Phase 16 plugin system. The WASM runtime (Extism) hangs off this feature once
# the 16.B loader lands, so default builds avoid the heavy native dependency;
# the registry seam itself (16.1) is always compiled. Runtime activation is
# additionally gated by PLUGINS_ENABLED (default false).
plugins = []
